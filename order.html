<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PattEcks! — Pre-order</title>
<meta name="description" content="Pre-order PattEcks! Drop 01: linen gauze henley and raw slub denim.">
<link rel="icon" href="assets/wordmark-ink.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&amp;display=swap" rel="stylesheet">
<style>
*{font-synthesis-weight:none}
.pe-script{font-family:"Jim Nightshade","SOV UI","SOV MuekMod",serif;letter-spacing:0}
@font-face{font-family:"SOV MuekMod";src:url("assets/sov-muekmod-regular.woff") format("woff");font-weight:400;font-display:swap;size-adjust:125%}
@font-face{font-family:"SOV MuekMod";src:url("assets/sov-muekmod-bold.woff") format("woff");font-weight:700;font-display:swap;size-adjust:125%}
@font-face{font-family:"SOV UI";src:url("assets/sov-muekmod-bold.woff") format("woff");font-weight:100 900;font-display:swap;unicode-range:U+0E00-0E7F;size-adjust:138%}
@font-face{font-family:"SOV UI";src:url("assets/sov-muekmod-bold.woff") format("woff");font-weight:100 900;font-display:swap;unicode-range:U+0000-0DFF,U+0E80-FFFF;size-adjust:112%}
.tx-bg > div{transition:opacity .9s ease}
.is-th *{letter-spacing:.01em !important}
body{margin:0;font-family:"SOV UI","SOV MuekMod","Helvetica Neue",Arial,sans-serif;letter-spacing:.03em}
a{color:inherit;text-decoration:none}
::selection{background:#890000;color:#f1ebe2}
.pd-nav a{position:relative}
.pd-nav a::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:1px;background:var(--silver,#b4b9be);transition:right .4s ease}
.pd-nav a:hover::after{right:0}
.or-root a:focus-visible,.or-root button:focus-visible,.or-root input:focus-visible,.or-root textarea:focus-visible{outline:2px solid var(--silver,#b4b9be);outline-offset:2px}
.or-btn{transition:background .3s ease}
.or-btn:hover{background:#a30d0d}
.or-in{box-sizing:border-box;width:100%;min-height:52px;padding:12px 14px;border:1px solid var(--silver,#6b7075);background:transparent;color:inherit;font:inherit;font-size:16px;letter-spacing:.02em}
.or-in::placeholder{color:var(--muted,#54575b);opacity:.8}
.or-size{min-width:52px;min-height:48px;border:1px solid var(--silver,#6b7075);background:transparent;color:inherit;font:inherit;font-size:14px;letter-spacing:.1em;cursor:pointer}
.or-size[aria-pressed="true"]{background:var(--ink,#1a1b1d);color:var(--ground,#e8e2d6);border-color:var(--ink,#1a1b1d)}
.or-step{width:48px;min-height:48px;border:1px solid var(--silver,#6b7075);background:transparent;color:inherit;font:inherit;font-size:20px;cursor:pointer}
@media (max-width:900px){.or-panel{padding:20px !important}}
.or-lab{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.is-th .or-lab{text-transform:none}
@media (max-width:900px){.or-cols{flex-direction:column !important}.or-side{position:static !important;width:100% !important}.or-pad{padding-left:24px !important;padding-right:24px !important}.or-big{font-size:34px !important}.or-nav{display:none !important}}

</style>
<script src="assets/gsap.min.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="or-root {{ thCls }}" style="--silver: {{ c.silver }}; --ink: {{ c.ink }}; --ground: {{ c.ground }}; --muted: {{ c.muted }}; position: relative; isolation: isolate; min-height: 100vh; overflow: hidden; background: {{ c.ground }}; color: {{ c.ink }}; transition: background-color .9s ease, color .9s ease;">
  <div class="tx-bg" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden;">
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.weave }}; background-size: 510px 510px; opacity: {{ tx.weave }};"></div>
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.concrete }}; background-size: 510px 510px; opacity: {{ tx.concrete }}; mix-blend-mode: {{ tx.blend }};"></div>
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.grain }}; background-size: 510px 510px; opacity: {{ tx.grain }}; mix-blend-mode: {{ tx.blend }};"></div>
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.leather }}; background-size: 510px 510px; opacity: {{ tx.leather }};"></div>
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 55% 55% at 45% 22%, rgba(255,255,255,0.05), rgba(255,255,255,0)); opacity: {{ tx.sheen }};"></div>
  </div>

  <header class="or-pad" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; padding: 24px 48px; position: relative; z-index: 4;">
    <a href="/" aria-label="PattEcks! home" style="display: inline-flex; align-items: center; min-height: 44px;"><img src="{{ logo }}" alt="PattEcks!" style="height: 44px; width: auto; display: block;"></a>
    <nav class="pd-nav or-nav" style="display: flex; gap: 40px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">
      <a href="/#collection">{{ t.collection }}</a>
      <a href="/about">{{ t.about }}</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">
      <button type="button" onClick="{{ toggleTheme }}" aria-label="Switch light or dark" style="min-height: 44px; min-width: 44px; padding: 0 12px; background: none; border: 1px solid {{ c.silver }}; color: {{ c.ink }}; font: inherit; letter-spacing: .12em; text-transform: uppercase;">{{ themeLabel }}</button>
      <button type="button" onClick="{{ toggleLang }}" aria-label="Switch language" style="min-height: 44px; min-width: 44px; padding: 0 12px; background: none; border: 1px solid {{ c.silver }}; color: {{ c.ink }}; font: inherit; letter-spacing: .12em;">{{ langLabel }}</button>
    </div>
  </header>

  <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
  <main class="or-pad" style="padding: 24px 48px 96px; position: relative; z-index: 2;">
    <div style="max-width: 1240px; margin: 0 auto;">
      <span style="display: block; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: {{ c.muted }}; margin-bottom: 14px;">{{ L.kicker }}</span>
      <h1 class="or-big" style="margin: 0 0 14px; font-family: 'SOV MuekMod', 'Courier New', monospace; font-weight: 700; font-size: 52px; line-height: 1.05; text-transform: uppercase;">{{ L.title }}</h1>
      <p style="margin: 0 0 48px; max-width: 60ch; font-size: 16px; line-height: 26px; color: {{ c.muted }};">{{ L.intro }}</p>

      <div class="or-cols" style="display: flex; gap: 48px; align-items: flex-start;">
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 32px;">

          <section class="or-panel" aria-labelledby="or-s1" style="background: {{ panelBg }}; border: 1px solid {{ c.silver }}; padding: 28px;">
            <div style="display: flex; align-items: center; gap: 16px; margin: 0 0 24px; padding-bottom: 18px; border-bottom: 1px solid {{ c.hair }};">
              <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #890000; color: #f1ebe2; font-family: 'SOV MuekMod', monospace; font-weight: 700; font-size: 20px;">1</span>
              <div style="display: flex; flex-direction: column; gap: 4px;"><h2 id="or-s1" style="margin: 0; font-size: 18px; letter-spacing: .1em; text-transform: uppercase;">{{ L.pick }}</h2><span style="font-size: 14px; color: {{ c.muted }};">{{ L.pickHint }}</span></div>
            </div>
            <sc-if value="{{ emptyCart }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding: 8px 0;">
                <p style="margin: 0; font-size: 17px;">{{ L.cartEmpty }}</p>
                <a href="/product#henley" class="or-btn" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; background: #890000; color: #f1ebe2; font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;">{{ L.shop }}</a>
              </div>
            </sc-if>
            <div style="display: flex; flex-direction: column; gap: 16px;">
              <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="1">
                <div style="display: flex; gap: 20px; align-items: flex-start; padding: 16px; border: 1px solid {{ c.hair }};">
                  <img src="{{ ln.img }}" alt="{{ ln.name }}" style="flex: none; width: 96px; height: 120px; object-fit: cover; display: block; background: {{ c.stone }};">
                  <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
                    <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline;">
                      <span class="pe-script" style="font-size: 26px;">{{ ln.name }}</span>
                      <span style="font-size: 17px; font-weight: 700;">{{ ln.sub }}</span>
                    </div>
                    <span style="font-size: 15px; letter-spacing: .08em;">{{ L.size }}: <b>{{ ln.size }}</b></span>
                    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                      <div style="display: flex; align-items: center;">
                        <button type="button" class="or-step" onClick="{{ ln.minus }}" aria-label="{{ L.less }}">−</button>
                        <span aria-live="polite" style="min-width: 44px; text-align: center; font-size: 17px; font-weight: 700;">{{ ln.qty }}</span>
                        <button type="button" class="or-step" onClick="{{ ln.plus }}" aria-label="{{ L.more }}">+</button>
                      </div>
                      <button type="button" onClick="{{ ln.remove }}" style="min-height: 44px; padding: 0 8px; background: none; border: 0; color: {{ c.muted }}; font: inherit; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; text-decoration: underline; cursor: pointer;">{{ L.remove }}</button>
                    </div>
                  </div>
                </div>
              </sc-for>
            </div>
            <sc-if value="{{ hasLines }}" hint-placeholder-val="{{ true }}">
              <a href="/product#henley" style="display: inline-flex; align-items: center; min-height: 44px; margin-top: 12px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid {{ c.silver }};">+ {{ L.addMore }}</a>
            </sc-if>
          </section>

          <section class="or-panel" aria-labelledby="or-s2" style="background: {{ panelBg }}; border: 1px solid {{ c.silver }}; padding: 28px;">
            <div style="display: flex; align-items: center; gap: 16px; margin: 0 0 24px; padding-bottom: 18px; border-bottom: 1px solid {{ c.hair }};">
              <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #890000; color: #f1ebe2; font-family: 'SOV MuekMod', monospace; font-weight: 700; font-size: 20px;">2</span>
              <div style="display: flex; flex-direction: column; gap: 4px;"><h2 id="or-s2" style="margin: 0; font-size: 18px; letter-spacing: .1em; text-transform: uppercase;">{{ L.ship }}</h2><span style="font-size: 14px; color: {{ c.muted }};">{{ L.shipHint }}</span></div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 16px;">
              <div><label class="or-lab" for="or-name">{{ L.name }} *</label><input id="or-name" class="or-in" autocomplete="name" value="{{ f.name }}" onInput="{{ setName }}"></div>
              <div><label class="or-lab" for="or-phone">{{ L.phone }} *</label><input id="or-phone" class="or-in" type="tel" inputmode="tel" autocomplete="tel" value="{{ f.phone }}" onInput="{{ setPhone }}"></div>
              <div><label class="or-lab" for="or-email">{{ L.email }}</label><input id="or-email" class="or-in" type="email" autocomplete="email" value="{{ f.email }}" onInput="{{ setEmail }}"></div>
              <div><label class="or-lab" for="or-ig">Instagram</label><input id="or-ig" class="or-in" placeholder="@" value="{{ f.ig }}" onInput="{{ setIg }}"></div>
              <div style="grid-column: 1 / -1;"><label class="or-lab" for="or-addr">{{ L.addr }} *</label><textarea id="or-addr" class="or-in" rows="3" autocomplete="street-address" onInput="{{ setAddr }}" style="resize: vertical;">{{ f.addr }}</textarea></div>
              <div style="grid-column: 1 / -1;"><label class="or-lab" for="or-note">{{ L.note }}</label><input id="or-note" class="or-in" value="{{ f.note }}" onInput="{{ setNote }}"></div>
            </div>
          </section>

          <section class="or-panel" aria-labelledby="or-s3" style="background: {{ panelBg }}; border: 1px solid {{ c.silver }}; padding: 28px;">
            <div style="display: flex; align-items: center; gap: 16px; margin: 0 0 24px; padding-bottom: 18px; border-bottom: 1px solid {{ c.hair }};">
              <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #890000; color: #f1ebe2; font-family: 'SOV MuekMod', monospace; font-weight: 700; font-size: 20px;">3</span>
              <div style="display: flex; flex-direction: column; gap: 4px;"><h2 id="or-s3" style="margin: 0; font-size: 18px; letter-spacing: .1em; text-transform: uppercase;">{{ L.pay }}</h2><span style="font-size: 14px; color: {{ c.muted }};">{{ L.payHint }}</span></div>
            </div>
            <div style="display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start;">
              <div style="flex: none; width: 240px; min-height: 220px; border: 1px dashed {{ c.silver }}; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; font-size: 13px; color: {{ c.muted }};">
                <sc-if value="{{ hasQr }}" hint-placeholder-val="{{ false }}"><img src="{{ qrSrc }}" alt="PromptPay QR" style="width: 100%; height: auto; display: block; background: #fff;"></sc-if>
                <sc-if value="{{ noQr }}" hint-placeholder-val="{{ true }}"><span>[PromptPay QR]</span></sc-if>
              </div>
              <div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 24px;">
                <span>{{ L.acct }}: <b>{{ payId }}</b></span>
                <span>{{ L.accName }}: <b>{{ payName }}</b></span>
                <span>{{ L.amount }}: <b>{{ totalText }}</b></span>
                <span style="color: {{ c.muted }}; font-size: 14px;">{{ L.payHow }}</span>
                <label class="or-lab" for="or-slip" style="margin: 10px 0 0;">{{ L.slip }} *</label>
                <input id="or-slip" type="file" accept="image/*" onChange="{{ pickSlip }}" style="font: inherit; font-size: 14px; min-height: 44px;">
                <sc-if value="{{ hasSlip }}" hint-placeholder-val="{{ false }}"><img src="{{ slipSrc }}" alt="{{ L.slipAlt }}" style="max-width: 180px; max-height: 240px; object-fit: contain; border: 1px solid {{ c.hair }};"></sc-if>
              </div>
            </div>
          </section>
        </div>

        <aside class="or-side" aria-labelledby="or-sum" style="flex: none; width: 380px; position: sticky; top: 24px; border: 1px solid {{ c.silver }}; outline: 1px dashed {{ c.silver }}; outline-offset: -8px; padding: 28px; box-sizing: border-box; background: {{ c.ground }};">
          <h2 id="or-sum" style="margin: 0 0 18px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase;">{{ L.summary }}</h2>
          <sc-if value="{{ emptyCart }}" hint-placeholder-val="{{ true }}"><p style="margin: 0 0 18px; font-size: 14px; color: {{ c.muted }};">{{ L.empty }}</p></sc-if>
          <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px;">
            <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="0">
              <div style="display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: 14px;">
                <span>{{ ln.label }}</span>
                <span style="display: flex; gap: 10px; align-items: center;"><span>{{ ln.sub }}</span><button type="button" onClick="{{ ln.remove }}" aria-label="{{ L.remove }} {{ ln.label }}" style="min-width: 44px; min-height: 44px; background: none; border: 0; color: inherit; font: inherit; font-size: 18px; cursor: pointer;">×</button></span>
              </div>
            </sc-for>
          </div>
          <div style="border-top: 1px solid {{ c.hair }}; padding-top: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px;">
            <div style="display: flex; justify-content: space-between;"><span>{{ L.items }}</span><span>{{ itemsText }}</span></div>
            <div style="display: flex; justify-content: space-between;"><span>{{ L.shipFee }}</span><span>{{ shipText }}</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 17px; margin-top: 6px;"><b>{{ L.total }}</b><b>{{ totalText }}</b></div>
          </div>
          <p style="margin: 18px 0 0; font-size: 13px; line-height: 21px; color: {{ c.muted }};">{{ L.preNote }}</p>
          <label style="display: flex; gap: 10px; align-items: flex-start; margin: 18px 0 0; font-size: 13px; line-height: 20px; cursor: pointer;"><input type="checkbox" onChange="{{ setConsent }}" style="width: 20px; height: 20px; margin: 0; flex: none;"><span>{{ L.consent }}</span></label>
          <button type="button" class="or-btn" onClick="{{ submit }}" style="width: 100%; min-height: 56px; margin-top: 18px; background: #890000; color: #f1ebe2; border: 0; font: inherit; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer;">{{ submitLabel }}</button>
          <p role="alert" style="margin: 12px 0 0; font-size: 14px; line-height: 21px; color: #c2271b;">{{ errText }}</p>
        </aside>
      </div>
    </div>
  </main>
  </sc-if>

  <sc-if value="{{ showDone }}" hint-placeholder-val="{{ false }}">
  <main class="or-pad" style="padding: 48px 48px 120px; position: relative; z-index: 2;">
    <div style="max-width: 720px; margin: 0 auto; border: 1px solid {{ c.silver }}; outline: 1px dashed {{ c.silver }}; outline-offset: -8px; padding: 40px; box-sizing: border-box; background: {{ c.ground }};">
      <span style="display: block; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: {{ c.muted }};">{{ L.doneKicker }}</span>
      <h1 class="or-big" style="margin: 12px 0 18px; font-family: 'SOV MuekMod', 'Courier New', monospace; font-weight: 700; font-size: 44px; line-height: 1.05; text-transform: uppercase;">{{ L.doneTitle }}</h1>
      <p style="margin: 0 0 22px; font-size: 16px; line-height: 26px;">{{ L.doneBody }}</p>
      <div style="font-size: 15px; line-height: 26px; border-top: 1px solid {{ c.hair }}; padding-top: 16px;">
        <div>{{ L.orderNo }}: <b>{{ orderId }}</b></div>
        <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="0"><div>{{ ln.label }} — {{ ln.sub }}</div></sc-for>
        <div>{{ L.total }}: <b>{{ totalText }}</b></div>
      </div>
      <p style="margin: 22px 0 0; font-size: 14px; color: {{ c.muted }};">{{ L.doneNote }}</p>
      <a href="/" style="display: inline-flex; align-items: center; min-height: 44px; margin-top: 18px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid {{ c.silver }};">{{ L.back }}</a>
    </div>
  </main>
  </sc-if>

  <footer class="or-pad" style="padding: 32px 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: {{ c.muted }};">
    <span>Instagram @[HANDLE]</span><span><a href="mailto:support@pattecks.com" style="color: inherit;">support@pattecks.com</a></span><span>{{ L.footer }}</span>
  </footer>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
DC.mount(document.getElementById('tpl'), document.getElementById('app'), function (DCLogic) {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const mq = (q) => !!(window.matchMedia && window.matchMedia(q).matches);
    this.sysDark = mq('(prefers-color-scheme: dark)');
    this.reduced = mq('(prefers-reduced-motion: reduce)');
    // ---- Shop settings: fill these in, everything else follows ----
    // price: number in THB, or null while it is not set (the page then shows [PRICE]).
    this.shop = {
      products: [
        { id: 'henley', name: 'Linen Gauze Henley', img: 'assets/henley.jpg', price: null },
        { id: 'denim', name: 'Raw Slub Denim', img: 'assets/denim.jpg', price: null }
      ],
      sizes: ['S', 'M', 'L', 'XL'],
      shipping: null,            // flat shipping fee in THB, or null for [SHIPPING]
      promptPayId: 'KBank xxx-x-x8519-x',
      accountName: 'นาย ปฐพี เอี่ยมนาม',
      qrImage: 'assets/promptpay-qr.png',               // uploaded image of your PromptPay QR; empty shows a placeholder
      shipDate: '[DATE]',
      orderUrl: 'https://script.google.com/macros/s/AKfycbzgyXFH7VDWqB70RJRGKzfq6YbnQnRMaXsDG0ms0yCOUnFrQE8l8jGFG8d_AH9-9AhxsA/exec'               // the Google Apps Script web app URL that saves orders to your Google Sheet
    };
    this.state = { theme: null, th: false, t: 0, sel: {}, qty: {}, err: {}, lines: [], f: { name: '', phone: '', email: '', ig: '', addr: '', note: '' }, slip: null, consent: false, sending: false, error: '', done: null };
    this.state.lines = this.readCart();
    try { this.state.th = localStorage.getItem('pe-lang') === 'th'; const tm = localStorage.getItem('pe-theme'); if (tm === 'night' || tm === 'linen') this.state.theme = tm; } catch (e) {}
    this.running = false;
  }
  componentDidMount() {
    this.syncPrefs();
    this.onStore = () => this.syncPrefs();
    window.addEventListener('storage', this.onStore);
    this.start();
    this.bakeTiles();
  }
  bakeTiles() {
    // Draw each code texture ONCE into a small seamless tile, then the page just repeats the picture.
    // The tile is drawn 3x3 with the noise stitched, and only the centre is kept, so edges match.
    const T = 510, W = 3 * T;
    const turb = (a, r) => `<feTurbulence ${a} stitchTiles="stitch" x="0" y="0" width="${T}" height="${T}" result="${r}0"/><feTile in="${r}0" x="0" y="0" width="${W}" height="${W}" result="${r}"/>`;
    const fl = (inner) => `<filter id="f" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${W}" color-interpolation-filters="sRGB">${inner}</filter>`;
    const lit = 'azimuth="235" elevation="48"';
    const src = {
