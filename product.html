<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PattEcks! — Product</title>
<meta name="description" content="PattEcks! — Bangkok clothing. Drop 01: linen gauze and raw slub denim.">
<meta property="og:title" content="PattEcks! — Product">
<meta property="og:description" content="PattEcks! — Bangkok clothing. Drop 01: linen gauze and raw slub denim.">
<meta property="og:image" content="assets/henley.jpg">
<link rel="icon" href="assets/wordmark-ink.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&amp;family=Krona+One&amp;display=swap" rel="stylesheet">
<style>

*{font-synthesis-weight:none}
.fx-worn{-webkit-mask-image:var(--worn,none);mask-image:var(--worn,none);-webkit-mask-size:300px 300px;mask-size:300px 300px}
.fx-ink{text-shadow:0 0 .6px currentColor,.3px .4px 1.8px color-mix(in srgb,currentColor 45%,transparent)}
.fx-drip{position:relative;display:inline-block}
.fx-drip i{position:absolute;top:74%;width:3px;height:16px;margin-left:-1.5px;border-radius:0 0 3px 3px;background:#890000;transform-origin:top;transform:scaleY(0);animation:fx-drip 6s cubic-bezier(.5,0,.75,0) infinite;pointer-events:none}
.fx-drip i::after{content:"";position:absolute;left:50%;bottom:-3px;width:6px;height:7px;margin-left:-3px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:#890000}
.fx-drip i:nth-child(1){left:14%;animation-delay:.4s}
.fx-drip i:nth-child(2){left:47%;height:24px;animation-delay:2.1s}
.fx-drip i:nth-child(3){left:83%;height:12px;animation-delay:3.6s}
@keyframes fx-drip{0%{transform:scaleY(0);opacity:1}55%{transform:scaleY(1);opacity:1}85%{transform:scaleY(1.08);opacity:1}100%{transform:scaleY(1.08);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx-drip i{animation:none;transform:scaleY(1)}}
@font-face{font-family:"SOV MuekMod";src:url("assets/sov-muekmod-regular.woff") format("woff");font-weight:400;font-display:swap;size-adjust:125%}
@font-face{font-family:"SOV MuekMod";src:url("assets/sov-muekmod-bold.woff") format("woff");font-weight:700;font-display:swap;size-adjust:125%}
@font-face{font-family:"SOV UI";src:url("assets/sov-muekmod-bold.woff") format("woff");font-weight:100 900;font-display:swap;unicode-range:U+0E00-0E7F;size-adjust:138%}
.tx-bg > div{transition:opacity .9s ease}
.is-th *{letter-spacing:.01em !important}
body{margin:0;font-family:"Jim Nightshade","SOV UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.03em}
a{color:inherit;text-decoration:none}
::selection{background:#890000;color:#f1ebe2}
.pd-nav a{position:relative}
.pd-nav a::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:1px;background:var(--silver,#b4b9be);transition:right .4s ease}
.pd-nav a:hover::after{right:0}
.pd-shot img{transition:transform .9s ease}
.pd-shot:hover img{transform:scale(1.02)}
.pd-size{transition:background .25s ease,color .25s ease}
.pd-btn{transition:background .3s ease}
.pd-btn:hover{background:#a30d0d}
.pd-acc{transition:background .3s ease}
.pd-acc:hover{background:var(--raised,#1e2125)}
.pd-next img{transition:transform .9s ease}
.pd-next:hover img{transform:scale(1.04)}
.pd-input:focus,.pd-root a:focus-visible,.pd-root button:focus-visible{outline:2px solid var(--silver,#b4b9be);outline-offset:2px}
@media (max-width:900px){.pd-cols{flex-direction:column}.pd-info{position:static !important}.pd-big{font-size:32px !important}}

</style>
<script src="assets/gsap.min.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="pd-root {{ thCls }}" style="--worn: {{ tx.img.worn }}; --silver: {{ c.silver }}; --raised: {{ c.raised }}; position: relative; isolation: isolate; min-height: 100vh; overflow: hidden; background: {{ c.ground }}; color: {{ c.ink }}; transition: background-color .9s ease, color .9s ease;" onMouseMove="{{ move }}">

  <div class="tx-bg" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden;">
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.weave }}; background-size: 510px 510px; opacity: {{ tx.weave }};"></div>
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.concrete }}; background-size: 510px 510px; opacity: {{ tx.concrete }}; mix-blend-mode: {{ tx.blend }};"></div>
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.grain }}; background-size: 510px 510px; opacity: {{ tx.grain }}; mix-blend-mode: {{ tx.blend }};"></div>
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.leather }}; background-size: 510px 510px; opacity: {{ tx.leather }};"></div>
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 55% 55% at 45% 22%, rgba(255,255,255,0.05), rgba(255,255,255,0)); opacity: {{ tx.sheen }};"></div>
  </div>

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; padding: 24px 48px; position: relative; z-index: 4;">
    <a href="index.html" aria-label="PattEcks! home"><img src="{{ logo }}" alt="PattEcks!" style="height: 44px; width: auto; display: block;"></a>
    <nav class="pd-nav" style="display: flex; gap: 40px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-family: {{ navFont }};">
      <a href="index.html#collection">{{ t.collection }}</a>
      <a href="index.html#archive">{{ t.archive }}</a>
      <a href="about.html">{{ t.about }}</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">
      <a href="https://www.instagram.com/" style="margin-right: 12px;">Instagram</a>
      <button type="button" onClick="{{ toggleTheme }}" aria-label="Switch light or dark" style="min-height: 44px; padding: 0 12px; background: none; border: 1px solid {{ c.silver }}; color: {{ c.ink }}; font: inherit; letter-spacing: .12em; text-transform: uppercase;">{{ themeLabel }}</button>
      <button type="button" onClick="{{ toggleLang }}" aria-label="Switch language" style="min-height: 44px; padding: 0 12px; background: none; border: 1px solid {{ c.silver }}; color: {{ c.ink }}; font: inherit; letter-spacing: .12em;">{{ langLabel }}</button>
    </div>
  </header>

  <div style="padding: 8px 48px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: {{ c.muted }};">
    <span><a href="index.html#collection">{{ t.collection }}</a> / Drop 01 / {{ p.no }}</span>
    <span style="display: flex; gap: 24px;">
      <button type="button" onClick="{{ prev }}" style="background: none; border: 0; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; min-height: 24px;">{{ L.prev }}</button>
      <span>{{ p.no }} / 02</span>
      <button type="button" onClick="{{ next }}" style="background: none; border: 0; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; min-height: 24px;">{{ L.next }}</button>
    </span>
  </div>

  <div class="pd-cols" style="display: flex; gap: 48px; align-items: flex-start; padding: 0 48px 96px;">

    <div style="flex: 7 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
      <figure style="margin: 0; position: relative; overflow: hidden; aspect-ratio: {{ p.ratio }}; background: {{ c.stone }};" onMouseMove="{{ lens }}" onMouseEnter="{{ lensOn }}" onMouseLeave="{{ lensOff }}">
        <img src="{{ p.main }}" alt="{{ p.mainAlt }}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        <sc-if value="{{ lensShow }}" hint-placeholder-val="{{ false }}">
          <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 200px; height: 200px; border-radius: 50%; border: 1px solid {{ c.silver }}; box-sizing: border-box; pointer-events: none; transform: translate({{ lensX }}px, {{ lensY }}px); background-image: url({{ p.main }}); background-repeat: no-repeat; background-size: {{ lensBgW }}px {{ lensBgH }}px; background-position: {{ lensBgX }}px {{ lensBgY }}px;"></div>
        </sc-if>
        <sc-if value="{{ p.isNew }}" hint-placeholder-val="{{ true }}">
          <span style="position: absolute; top: 16px; left: 16px; background: #890000; color: #f1ebe2; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 6px 10px;">New drop</span>
        </sc-if>
        <figcaption style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #f1ebe2;"><span>{{ L.hoverZoom }}</span><span>{{ p.mainTag }}</span></figcaption>
      </figure>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{ p.shots }}" as="s" hint-placeholder-count="2">
          <figure class="pd-shot" style="margin: 0; position: relative; overflow: hidden; aspect-ratio: 3 / 4; background: {{ c.stone }};">
            <sc-if value="{{ s.src }}" hint-placeholder-val="{{ true }}">
              <img src="{{ s.src }}" alt="{{ s.alt }}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            </sc-if>
            <sc-if value="{{ s.empty }}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: {{ c.muted }};">{{ s.alt }}</span>
            </sc-if>
            <figcaption style="position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: {{ s.capColor }};"><span>{{ s.label }}</span><span>{{ s.tag }}</span></figcaption>
          </figure>
        </sc-for>
      </div>
    </div>

    <aside class="pd-info" style="flex: 5 1 0; min-width: 0; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 28px;">
      <div style="position: relative;" onMouseEnter="{{ wetOn }}" onMouseLeave="{{ wetOff }}">
        <span style="display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: {{ c.muted }}; margin-bottom: 12px;">{{ p.no }} — Drop 01</span>
        <h1 class="pd-big fx-ink" style="margin: 0; font-size: 48px; line-height: 1; letter-spacing: -.01em; font-weight: 400;">{{ p.name }}</h1>
        <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 0; pointer-events: none;">
          <sc-for list="{{ nameDrops }}" as="d" hint-placeholder-count="0">
            <span style="position: absolute; left: {{ d.x }}px; top: 0; width: 1px; height: {{ d.h }}px; background: #890000; opacity: {{ d.lo }}; transform: translateY({{ d.y }}px);"></span>
            <span style="position: absolute; left: {{ d.rx }}px; top: {{ d.land }}px; width: {{ d.rw }}px; height: 1px; background: #890000; opacity: {{ d.so }};"></span>
            <span style="position: absolute; left: {{ d.x }}px; top: {{ d.land }}px; width: 2px; height: 2px; border-radius: 50%; background: #890000; opacity: {{ d.so }}; transform: translate({{ d.dx }}px, {{ d.dy }}px);"></span>
            <span style="position: absolute; left: {{ d.x }}px; top: {{ d.land }}px; width: 2px; height: 2px; border-radius: 50%; background: #890000; opacity: {{ d.so }}; transform: translate(-{{ d.dx }}px, {{ d.dy }}px);"></span>
          </sc-for>
        </span>
        <span style="display: block; margin-top: 16px; font-size: 15px; letter-spacing: .12em;">THB [PRICE]</span>
      </div>

      <p style="margin: 0; font-size: 17px; line-height: 26px; color: {{ c.muted }}; max-width: 44ch;">{{ p.desc }}</p>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;"><span>{{ L.size }}</span><span style="color: {{ c.muted }};">{{ L.sizeTbc }}</span></div>
        <div role="group" aria-label="Size" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{ sizes }}" as="z" hint-placeholder-count="4">
            <button type="button" class="pd-size" onClick="{{ z.pick }}" aria-pressed="{{ z.on }}" style="min-width: 56px; min-height: 48px; padding: 0 16px; border-radius: 3px; border: 1px solid {{ c.silver }}; background: {{ z.bg }}; color: {{ z.fg }}; font: inherit; font-size: 13px; letter-spacing: .12em;">{{ z.label }}</button>
          </sc-for>
        </div>
        <span style="font-size: 13px; letter-spacing: .04em; color: {{ c.muted }};">{{ p.fit }}</span>
      </div>

      <sc-if value="{{ notJoined }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ join }}" style="display: flex; flex-direction: column; gap: 8px;">
          <label for="pd-email" style="font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">{{ L.notifyLabel }}</label>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <input id="pd-email" class="pd-input" type="email" required="" placeholder="you@email.com" style="flex: 1 1 200px; min-width: 0; min-height: 52px; padding: 0 16px; background: {{ c.ground }}; border: 1px solid {{ c.silver }}; color: {{ c.ink }}; font: inherit; font-size: 17px;">
            <button class="pd-btn" type="submit" style="min-height: 52px; padding: 0 28px; background: #890000; color: #f1ebe2; border: 0; font: inherit; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">{{ L.notify }}</button>
          </div>
        </form>
      </sc-if>
      <sc-if value="{{ joined }}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">{{ L.onList }} {{ p.name }}{{ sizeNote }}</p>
      </sc-if>
      <a href="https://www.instagram.com/" style="font-size: 13px; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid {{ c.silver }}; padding-bottom: 4px; align-self: flex-start;">{{ L.askIg }}</a>

      <div style="border-top: 1px solid {{ c.hair }};">
        <sc-for list="{{ sections }}" as="a" hint-placeholder-count="3">
          <div style="border-bottom: 1px solid {{ c.hair }};">
            <button type="button" class="pd-acc" onClick="{{ a.toggle }}" aria-expanded="{{ a.open }}" style="width: 100%; min-height: 56px; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; background: none; border: 0; color: {{ c.ink }}; font: inherit; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">
              <span>{{ a.title }}</span><span aria-hidden="true" style="display: inline-block; transition: transform .3s ease; transform: rotate({{ a.rot }}deg);">+</span>
            </button>
            <sc-if value="{{ a.open }}" hint-placeholder-val="{{ false }}">
              <div style="padding: 4px 4px 24px; display: grid; grid-template-columns: 110px 1fr; gap: 10px 16px; font-size: 13px; letter-spacing: .06em;">
                <sc-for list="{{ a.rows }}" as="r" hint-placeholder-count="3">
                  <span style="color: {{ c.muted }}; text-transform: uppercase; letter-spacing: .12em;">{{ r.k }}</span><span>{{ r.v }}</span>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </aside>
  </div>

  <section style="padding: 0 48px 96px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid {{ c.hair }}; padding-top: 24px; margin-bottom: 16px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">
      <h2 style="margin: 0; font-family: {{ displayFont }}; font-weight: 800; font-size: 24px; letter-spacing: 0;">{{ L.also }}</h2>
      <span style="color: {{ c.muted }};">{{ o.no }} / 02</span>
    </div>
    <button type="button" class="pd-next" onClick="{{ next }}" style="display: flex; gap: 24px; align-items: stretch; width: 100%; padding: 0; background: none; border: 0; color: inherit; font: inherit; text-align: left;">
      <span style="flex: none; width: 240px; aspect-ratio: 3 / 4; overflow: hidden; background: {{ c.stone }}; display: block;"><img src="{{ o.main }}" alt="{{ o.mainAlt }}" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span>
      <span style="display: flex; flex-direction: column; justify-content: space-between; padding: 8px 0;">
        <span style="font-size: 32px; letter-spacing: -.01em;">{{ o.name }}</span>
        <span style="font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: {{ c.muted }};">{{ o.fabricLine }}</span>
        <span style="font-size: 13px; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid {{ c.silver }}; padding-bottom: 4px; align-self: flex-start;">{{ L.view }} {{ o.no }}</span>
      </span>
    </button>
  </section>

  <footer style="padding: 32px 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: {{ c.muted }};">
    <span>PattEcks! — Bangkok</span><span>Instagram @[HANDLE]</span><span>{{ L.tagline }}</span>
  </footer>

  <div class="pd-dot" aria-hidden="true" style="position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; border: 1px solid {{ c.silver }}; box-sizing: border-box; pointer-events: none; z-index: 10; opacity: {{ dotO }}; will-change: transform;"></div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
DC.mount(document.getElementById('tpl'), document.getElementById('app'), function (DCLogic) {

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const mq = (q) => !!(window.matchMedia && window.matchMedia(q).matches);
    this.sysDark = mq('(prefers-color-scheme: dark)');
    this.reduced = mq('(prefers-reduced-motion: reduce)');
    this.state = { i: 0, size: null, open: 'fabric', theme: null, th: false, joined: false, t: 0, lens: false, lx: 0, ly: 0, lw: 1, lh: 1, wet: false };
    // Language and theme are shared by every page through this browser's storage.
    try { this.state.th = localStorage.getItem('pe-lang') === 'th'; const tm = localStorage.getItem('pe-theme'); if (tm === 'night' || tm === 'linen') this.state.theme = tm; } catch (e) {}
    this.products = [
      {
        no: '01', name: 'Linen Gauze Henley', ratio: '3 / 4', weave: 'gauze', isNew: true,
        main: 'assets/henley.jpg', mainAlt: 'Reference: white gauze henley laid flat on raw concrete', mainTag: 'Reference',
        desc: 'A long-sleeve henley in open linen gauze. Cropped and cut close, with the placket set on a tilt. Made to be worn every day in Bangkok heat.',
        descTh: 'เฮนลีย์แขนยาวผ้าลินินกอซ ทรงครอปตัดเข้าตัว กระดุมคอเอียง ทำมาให้ใส่ได้ทุกวันในอากาศร้อนของกรุงเทพ',
        fit: 'Cropped and cut close to the body. Not oversized.',
        fitTh: 'ทรงครอป ตัดเข้าตัว ไม่ใช่ทรงหลวม',
        fabricLine: '100% linen gauze / cropped / tilted placket',
        shots: [
          { src: 'assets/sheer-linen.jpg', alt: 'Reference: linen held to the light', label: 'Fabric — held to the light', tag: 'Reference', light: true },
          { src: 'assets/neck-label.jpg', alt: 'Reference: neck label detail', label: 'Detail — neck label', tag: 'Reference', light: true }
        ],
        fabric: [{ k: 'Fabric', v: '100% linen, gauze weave' }, { k: 'Feel', v: 'Open, light, breathes in heat' }, { k: 'Wash', v: '[Care instructions]' }, { k: 'Dry', v: '[Drying instructions]' }]
      },
      {
        no: '02', name: 'Raw Slub Denim', ratio: '4 / 5', weave: 'slub', isNew: true,
        main: 'assets/denim.jpg', mainAlt: 'Raw slub denim jeans laid flat on concrete', mainTag: '',
        desc: 'Unwashed raw denim with a slub yarn that leaves the surface uneven by design. It fades to the person who wears it.',
        descTh: 'ยีนส์ดิบไม่ผ่านการซัก เส้นด้าย slub ทำให้ผิวผ้าไม่เรียบโดยตั้งใจ สีจะซีดตามคนที่ใส่',
        fit: 'Straight leg. [Rise and leg opening to confirm]',
        fitTh: 'ขาตรง [เอวและปลายขารอยืนยัน]',
        fabricLine: 'Raw slub denim / unwashed',
        shots: [
          { src: '', alt: 'Slub texture close-up — photo coming', label: 'Fabric — slub texture', tag: '', light: false },
          { src: '', alt: 'Pocket and hardware detail — photo coming', label: 'Detail — pocket', tag: '', light: false }
        ],
        fabric: [{ k: 'Fabric', v: 'Raw slub denim, unwashed' }, { k: 'Weight', v: '[oz to confirm]' }, { k: 'Wash', v: '[Care instructions]' }, { k: 'Note', v: 'Indigo may transfer before the first wash' }]
      }
    ];
    this.sizeList = ['S', 'M', 'L', 'XL'];
    // Rain on the product name: lands on the cap line (about 8px into the 48px heading, 24px below the label).
    this.drops = [];
    for (let i = 0; i < 10; i++) this.drops.push({ x: 6 + ((i * 47) % 380), land: 36, top: 80, h: 18 + (i * 7) % 22, v: 720 + (i % 3) * 150, off: i * 0.19, gap: 0.1 + (i % 3) * 0.2, o: 0.85 });
    this.running = false;
  }
  componentDidMount() {
    this.syncPrefs();
    this.onStore = () => this.syncPrefs();
    window.addEventListener('storage', this.onStore);
    this.start();
    this.bakeTiles();
  }

  bakeTiles() {
    // Draw each code texture ONCE into a small seamless tile, then the page just repeats the picture.
    // The tile is drawn 3x3 with the noise stitched, and only the centre is kept, so edges match.
    const T = 510, W = 3 * T;
    const turb = (a, r) => `<feTurbulence ${a} stitchTiles="stitch" x="0" y="0" width="${T}" height="${T}" result="${r}0"/><feTile in="${r}0" x="0" y="0" width="${W}" height="${W}" result="${r}"/>`;
    const fl = (inner) => `<filter id="f" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${W}" color-interpolation-filters="sRGB">${inner}</filter>`;
    const lit = 'azimuth="235" elevation="48"';
    const src = {
