<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PattEcks! — About us</title>
<meta name="description" content="PattEcks! — Bangkok clothing. Drop 01: linen gauze and raw slub denim.">
<meta property="og:title" content="PattEcks! — About us">
<meta property="og:description" content="PattEcks! — Bangkok clothing. Drop 01: linen gauze and raw slub denim.">
<meta property="og:image" content="assets/henley.jpg">
<link rel="icon" href="assets/wordmark-ink.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&amp;family=Krona+One&amp;display=swap" rel="stylesheet">
<style>

*{font-synthesis-weight:none}
.fx-worn{-webkit-mask-image:var(--worn,none);mask-image:var(--worn,none);-webkit-mask-size:300px 300px;mask-size:300px 300px}
.fx-ink{text-shadow:0 0 .6px currentColor,.3px .4px 1.8px color-mix(in srgb,currentColor 45%,transparent)}
.fx-drip{position:relative;display:inline-block}
.fx-drip i{position:absolute;top:74%;width:3px;height:16px;margin-left:-1.5px;border-radius:0 0 3px 3px;background:#890000;transform-origin:top;transform:scaleY(0);animation:fx-drip 6s cubic-bezier(.5,0,.75,0) infinite;pointer-events:none}
.fx-drip i::after{content:"";position:absolute;left:50%;bottom:-3px;width:6px;height:7px;margin-left:-3px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:#890000}
.fx-drip i:nth-child(1){left:14%;animation-delay:.4s}
.fx-drip i:nth-child(2){left:47%;height:24px;animation-delay:2.1s}
.fx-drip i:nth-child(3){left:83%;height:12px;animation-delay:3.6s}
@keyframes fx-drip{0%{transform:scaleY(0);opacity:1}55%{transform:scaleY(1);opacity:1}85%{transform:scaleY(1.08);opacity:1}100%{transform:scaleY(1.08);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx-drip i{animation:none;transform:scaleY(1)}}
@font-face{font-family:"SOV MuekMod";src:url("assets/sov-muekmod-regular.woff") format("woff");font-weight:400;font-display:swap;size-adjust:125%}
@font-face{font-family:"SOV MuekMod";src:url("assets/sov-muekmod-bold.woff") format("woff");font-weight:700;font-display:swap;size-adjust:125%}
@font-face{font-family:"SOV UI";src:url("assets/sov-muekmod-bold.woff") format("woff");font-weight:100 900;font-display:swap;unicode-range:U+0E00-0E7F;size-adjust:138%}
.tx-bg > div{transition:opacity .9s ease}
.is-th *{letter-spacing:.01em !important}
body{margin:0;font-family:"Jim Nightshade","SOV UI","Helvetica Neue",Arial,sans-serif;letter-spacing:.03em}
a{color:inherit;text-decoration:none}
::selection{background:#890000;color:#f1ebe2}
.ab-nav a{position:relative}
.ab-nav a::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:1px;background:var(--silver,#b4b9be);transition:right .4s ease}
.ab-nav a:hover::after,.ab-nav a[aria-current="page"]::after{right:0}
.ab-row{position:relative;transition:padding-left .45s cubic-bezier(.2,.8,.2,1)}
.ab-row::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:#890000;transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.ab-row:hover{padding-left:24px}
.ab-row:hover::after{transform:scaleX(1)}
.ab-row .ab-no{transition:color .3s ease}
.ab-row:hover .ab-no{color:#890000}
.ab-row .ab-sub{transition:opacity .45s ease,transform .45s ease;opacity:.75}
.ab-row:hover .ab-sub{opacity:1;transform:translateX(6px)}
.ab-img img{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.ab-img:hover img{transform:scale(1.04)}
.ab-btn{transition:background .3s ease}
.ab-btn:hover{background:#a30d0d}
.is-th [style*="font-size: 11px"]{font-size:14px !important}
.is-th [style*="font-size: 13px"]{font-size:15px !important}
.ab-root a:focus-visible,.ab-root button:focus-visible{outline:2px solid var(--silver,#b4b9be);outline-offset:2px}
@media (max-width:900px){.ab-big{font-size:44px !important}.ab-cols{flex-direction:column !important}.ab-deg{font-size:120px !important}.ab-cards{grid-template-columns:1fr !important}}

</style>
<script src="assets/gsap.min.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="ab-root {{ thCls }}" style="--worn: {{ tx.img.worn }}; --silver: {{ c.silver }}; --raised: {{ c.raised }}; position: relative; isolation: isolate; min-height: 100vh; overflow: hidden; background: {{ c.ground }}; color: {{ c.ink }}; transition: background-color .9s ease, color .9s ease;" onMouseMove="{{ move }}">

  <div class="tx-bg" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden;">
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.weave }}; background-size: 510px 510px; opacity: {{ tx.weave }};"></div>
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.concrete }}; background-size: 510px 510px; opacity: {{ tx.concrete }}; mix-blend-mode: {{ tx.blend }};"></div>
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.grain }}; background-size: 510px 510px; opacity: {{ tx.grain }}; mix-blend-mode: {{ tx.blend }};"></div>
    <div style="position: absolute; inset: 0; background-image: {{ tx.img.leather }}; background-size: 510px 510px; opacity: {{ tx.leather }};"></div>
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 55% 55% at 45% 22%, rgba(255,255,255,0.05), rgba(255,255,255,0)); opacity: {{ tx.sheen }};"></div>
  </div>

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; padding: 24px 48px; position: relative; z-index: 4;">
    <a href="index.html" aria-label="PattEcks! home"><img src="{{ logo }}" alt="PattEcks!" style="height: 44px; width: auto; display: block;"></a>
    <nav class="ab-nav" style="display: flex; gap: 40px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-family: {{ navFont }};">
      <a href="index.html#collection">{{ t.collection }}</a>
      <a href="index.html#archive">{{ t.archive }}</a>
      <a href="about.html" aria-current="page">{{ t.about }}</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">
      <a href="https://www.instagram.com/" style="margin-right: 12px;">Instagram</a>
      <button type="button" onClick="{{ toggleTheme }}" aria-label="Switch light or dark" style="min-height: 44px; padding: 0 12px; background: none; border: 1px solid {{ c.silver }}; color: {{ c.ink }}; font: inherit; letter-spacing: .12em; text-transform: uppercase;">{{ themeLabel }}</button>
      <button type="button" onClick="{{ toggleLang }}" aria-label="Switch language" style="min-height: 44px; padding: 0 12px; background: none; border: 1px solid {{ c.silver }}; color: {{ c.ink }}; font: inherit; letter-spacing: .12em;">{{ langLabel }}</button>
    </div>
  </header>

  <section class="ab-hero" style="position: relative; padding: 120px 48px 96px;">
    <span style="display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: {{ c.muted }}; margin-bottom: 40px;">{{ L.kicker }}</span>
    <h1 class="ab-big fx-worn" style="margin: 0; font-family: {{ displayFont }}; font-weight: 800; font-size: {{ heroSize }}px; line-height: 1.02; letter-spacing: 0; text-transform: uppercase;">
      <span class="ab-line1" style="display: table;">{{ L.h1 }}</span>
      <span class="ab-line2" style="display: table; color: #890000;">{{ L.h2 }}</span>
    </h1>
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 0; pointer-events: none;">
          <sc-for list="{{ heroDrops }}" as="d" hint-placeholder-count="0">
            <span style="position: absolute; left: {{ d.x }}px; top: 0; width: 1px; height: {{ d.h }}px; background: #890000; opacity: {{ d.lo }}; transform: translateY({{ d.y }}px);"></span>
            <span style="position: absolute; left: {{ d.rx }}px; top: {{ d.land }}px; width: {{ d.rw }}px; height: 1px; background: #890000; opacity: {{ d.so }};"></span>
            <span style="position: absolute; left: {{ d.x }}px; top: {{ d.land }}px; width: 2px; height: 2px; border-radius: 50%; background: #890000; opacity: {{ d.so }}; transform: translate({{ d.dx }}px, {{ d.dy }}px);"></span>
            <span style="position: absolute; left: {{ d.x }}px; top: {{ d.land }}px; width: 2px; height: 2px; border-radius: 50%; background: #890000; opacity: {{ d.so }}; transform: translate(-{{ d.dx }}px, {{ d.dy }}px);"></span>
          </sc-for>
    </span>
    <p style="margin: 56px 0 0 auto; max-width: 46ch; font-size: 19px; line-height: 30px; color: {{ c.muted }};">{{ L.intro }}</p>
  </section>

  <section style="padding: 0 48px 120px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid {{ c.hair }}; padding-bottom: 16px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: {{ c.muted }};"><span>{{ L.rulesLabel }}</span><span>01 — 03</span></div>
    <sc-for list="{{ rules }}" as="r" hint-placeholder-count="3">
      <div class="ab-row" style="display: grid; grid-template-columns: 96px minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; align-items: baseline; padding: 40px 0; border-bottom: 1px solid {{ c.hair }};">
        <span class="ab-no" style="font-size: 13px; letter-spacing: .14em; color: {{ c.muted }};">{{ r.no }}</span>
        <span style="font-family: {{ displayFont }}; font-weight: 800; font-size: {{ ruleSize }}px; line-height: 1.15; letter-spacing: 0;">{{ r.line }}</span>
        <span class="ab-sub" style="font-size: 15px; line-height: 24px; color: {{ c.muted }};">{{ r.sub }}</span>
      </div>
    </sc-for>
  </section>

  <section class="ab-cols" style="display: flex; gap: 64px; align-items: center; padding: 0 48px 140px;">
    <figure class="ab-img" style="flex: 5 1 0; min-width: 0; margin: 0; position: relative; overflow: hidden; aspect-ratio: 4 / 5; background: {{ c.stone }};">
      <img src="assets/silver-mask.jpg" alt="Reference: polished silver mask with a tear" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      <figcaption style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #f1ebe2;"><span>{{ L.maskCap }}</span><span>Reference</span></figcaption>
    </figure>
    <div style="flex: 6 1 0; min-width: 0; display: flex; flex-direction: column; gap: 28px;">
      <span style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: {{ c.muted }};">{{ L.faceLabel }}</span>
      <h2 class="ab-big" style="margin: 0; font-family: {{ displayFont }}; font-weight: 800; font-size: {{ faceSize }}px; line-height: 1; letter-spacing: 0; text-transform: uppercase;">{{ L.faceTitle }}</h2>
      <p style="margin: 0; max-width: 44ch; font-size: 19px; line-height: 30px;">{{ L.face1 }}</p>
      <p style="margin: 0; max-width: 44ch; font-size: 15px; line-height: 25px; color: {{ c.muted }};">{{ L.face2 }}</p>
    </div>
  </section>

  <section style="position: relative; padding: 96px 48px 120px; background: {{ c.raised }};">
    <div class="ab-cols" style="display: flex; gap: 64px; align-items: flex-start;">
      <div style="flex: 6 1 0; min-width: 0; display: flex; flex-direction: column; gap: 28px;">
        <span style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: {{ c.muted }};">{{ L.cityLabel }}</span>
        <div style="position: relative; align-self: flex-start;" onMouseEnter="{{ coolOn }}" onMouseLeave="{{ coolOff }}">
          <span class="ab-deg" style="display: block; font-family: 'Krona One', 'Arial Black', sans-serif; font-weight: 800; font-size: 220px; line-height: .9; letter-spacing: -.02em; color: {{ degColor }}; transition: color .9s ease;">{{ deg }}°</span>
          <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 0; pointer-events: none;">
          <sc-for list="{{ degDrops }}" as="d" hint-placeholder-count="0">
            <span style="position: absolute; left: {{ d.x }}px; top: 0; width: 1px; height: {{ d.h }}px; background: #890000; opacity: {{ d.lo }}; transform: translateY({{ d.y }}px);"></span>
            <span style="position: absolute; left: {{ d.rx }}px; top: {{ d.land }}px; width: {{ d.rw }}px; height: 1px; background: #890000; opacity: {{ d.so }};"></span>
            <span style="position: absolute; left: {{ d.x }}px; top: {{ d.land }}px; width: 2px; height: 2px; border-radius: 50%; background: #890000; opacity: {{ d.so }}; transform: translate({{ d.dx }}px, {{ d.dy }}px);"></span>
            <span style="position: absolute; left: {{ d.x }}px; top: {{ d.land }}px; width: 2px; height: 2px; border-radius: 50%; background: #890000; opacity: {{ d.so }}; transform: translate(-{{ d.dx }}px, {{ d.dy }}px);"></span>
          </sc-for>
          </span>
          <span style="display: block; margin-top: 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: {{ c.muted }};">{{ L.degNote }}</span>
        </div>
        <h2 style="margin: 16px 0 0; font-family: {{ displayFont }}; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: 0; text-transform: uppercase;">{{ L.cityTitle }}</h2>
        <p style="margin: 0; max-width: 46ch; font-size: 17px; line-height: 28px; color: {{ c.muted }};">{{ L.city }}</p>
      </div>
      <figure class="ab-img" style="flex: 5 1 0; min-width: 0; margin: 0; position: relative; overflow: hidden; aspect-ratio: 3 / 4; background: {{ c.stone }};">
        <img src="assets/street.jpg" alt="Reference: street-cast editorial in layered long sleeves" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        <figcaption style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #f1ebe2;"><span>{{ L.streetCap }}</span><span>Reference</span></figcaption>
      </figure>
    </div>
  </section>

  <section style="padding: 120px 48px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid {{ c.hair }}; padding-bottom: 16px; margin-bottom: 32px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: {{ c.muted }};"><span>{{ L.matLabel }}</span><span>{{ L.matHint }}</span></div>
    <div class="ab-cards" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px;">
      <button type="button" onClick="{{ m0.flip }}" aria-pressed="{{ m0.on }}" aria-label="{{ L.flipAria }}" style="position: relative; display: block; width: 100%; height: 380px; padding: 0; margin: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; perspective: 1400px;">
        <span style="position: absolute; inset: 0; display: block; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.2,.8,.2,1); transform: rotateY({{ m0.deg }}deg);">
          <span style="position: absolute; inset: 0; box-sizing: border-box; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: {{ c.ground }}; border: 1px solid {{ c.silver }}; outline: 1px dashed {{ c.silver }}; outline-offset: -8px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">
            <span aria-hidden="true" style="position: absolute; top: -1px; left: 28px; width: 10px; height: 3px; background: #890000;"></span>
            <span style="display: flex; justify-content: space-between; gap: 16px;"><span>PattEcks! / {{ L.material }}</span><span style="color: {{ c.muted }};">No. 01</span></span>
            <span style="display: flex; flex-direction: column; gap: 14px;">
              <span style="font-family: {{ displayFont }}; font-weight: 800; font-size: 30px; letter-spacing: 0; text-transform: none;">{{ m0.name }}</span>
              <span style="display: flex; flex-direction: column; gap: 8px; color: {{ c.muted }};"><span>{{ m0.f1 }}</span><span>{{ m0.f2 }}</span><span>{{ m0.f3 }}</span></span>
            </span>
            <span style="align-self: flex-end; font-size: 11px; color: {{ c.muted }}; border-bottom: 1px solid {{ c.silver }}; padding-bottom: 2px;">{{ L.flip }}</span>
          </span>
          <span style="position: absolute; inset: 0; box-sizing: border-box; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); background: {{ c.raised }}; border: 1px solid {{ c.silver }}; outline: 1px dashed {{ c.silver }}; outline-offset: -8px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; letter-spacing: .12em;">
            <span style="display: flex; justify-content: space-between; gap: 16px; text-transform: uppercase;"><span>{{ L.why }}</span><span style="color: {{ c.muted }};">No. 01 — {{ L.back }}</span></span>
            <span style="font-size: 17px; line-height: 27px; letter-spacing: .02em;">{{ m0.why }}</span>
            <span style="display: grid; grid-template-columns: 96px 1fr; gap: 10px 16px; text-transform: uppercase;">
              <span style="color: {{ c.muted }};">{{ L.care }}</span><span>{{ m0.care }}</span>
              <span style="color: {{ c.muted }};">{{ L.note }}</span><span>{{ m0.note }}</span>
            </span>
            <span style="align-self: flex-end; font-size: 11px; color: {{ c.muted }}; border-bottom: 1px solid {{ c.silver }}; padding-bottom: 2px; text-transform: uppercase;">{{ L.flipBack }}</span>
          </span>
        </span>
      </button>
      <button type="button" onClick="{{ m1.flip }}" aria-pressed="{{ m1.on }}" aria-label="{{ L.flipAria }}" style="position: relative; display: block; width: 100%; height: 380px; padding: 0; margin: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; perspective: 1400px;">
        <span style="position: absolute; inset: 0; display: block; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.2,.8,.2,1); transform: rotateY({{ m1.deg }}deg);">
          <span style="position: absolute; inset: 0; box-sizing: border-box; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: {{ c.ground }}; border: 1px solid {{ c.silver }}; outline: 1px dashed {{ c.silver }}; outline-offset: -8px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">
            <span aria-hidden="true" style="position: absolute; top: -1px; left: 28px; width: 10px; height: 3px; background: #890000;"></span>
            <span style="display: flex; justify-content: space-between; gap: 16px;"><span>PattEcks! / {{ L.material }}</span><span style="color: {{ c.muted }};">No. 02</span></span>
            <span style="display: flex; flex-direction: column; gap: 14px;">
              <span style="font-family: {{ displayFont }}; font-weight: 800; font-size: 30px; letter-spacing: 0; text-transform: none;">{{ m1.name }}</span>
              <span style="display: flex; flex-direction: column; gap: 8px; color: {{ c.muted }};"><span>{{ m1.f1 }}</span><span>{{ m1.f2 }}</span><span>{{ m1.f3 }}</span></span>
            </span>
            <span style="align-self: flex-end; font-size: 11px; color: {{ c.muted }}; border-bottom: 1px solid {{ c.silver }}; padding-bottom: 2px;">{{ L.flip }}</span>
          </span>
          <span style="position: absolute; inset: 0; box-sizing: border-box; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); background: {{ c.raised }}; border: 1px solid {{ c.silver }}; outline: 1px dashed {{ c.silver }}; outline-offset: -8px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; letter-spacing: .12em;">
            <span style="display: flex; justify-content: space-between; gap: 16px; text-transform: uppercase;"><span>{{ L.why }}</span><span style="color: {{ c.muted }};">No. 02 — {{ L.back }}</span></span>
            <span style="font-size: 17px; line-height: 27px; letter-spacing: .02em;">{{ m1.why }}</span>
            <span style="display: grid; grid-template-columns: 96px 1fr; gap: 10px 16px; text-transform: uppercase;">
              <span style="color: {{ c.muted }};">{{ L.care }}</span><span>{{ m1.care }}</span>
              <span style="color: {{ c.muted }};">{{ L.note }}</span><span>{{ m1.note }}</span>
            </span>
            <span style="align-self: flex-end; font-size: 11px; color: {{ c.muted }}; border-bottom: 1px solid {{ c.silver }}; padding-bottom: 2px; text-transform: uppercase;">{{ L.flipBack }}</span>
          </span>
        </span>
      </button>
    </div>
  </section>

  <section style="padding: 0 48px 120px; display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; align-items: flex-end;">
    <h2 style="margin: 0; font-family: {{ displayFont }}; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: 0; text-transform: uppercase; max-width: 18ch;"><span class="fx-drip">{{ L.ctaTitle }}<i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i></span></h2>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <a class="ab-btn" href="index.html#collection" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; background: #890000; color: #f1ebe2; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">{{ L.cta }}</a>
      <a href="https://www.instagram.com/" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border: 1px solid {{ c.silver }}; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;">Instagram</a>
    </div>
  </section>

  <footer style="padding: 32px 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: {{ c.muted }}; border-top: 1px solid {{ c.hair }};">
    <span>PattEcks! — Bangkok</span><span>Instagram @[HANDLE]</span><span>{{ L.tagline }}</span>
  </footer>

  <div class="ab-dot" aria-hidden="true" style="position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; border: 1px solid {{ c.silver }}; box-sizing: border-box; pointer-events: none; z-index: 10; will-change: transform;"></div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
DC.mount(document.getElementById('tpl'), document.getElementById('app'), function (DCLogic) {

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const mq = (q) => !!(window.matchMedia && window.matchMedia(q).matches);
    this.sysDark = mq('(prefers-color-scheme: dark)');
    this.reduced = mq('(prefers-reduced-motion: reduce)');
    this.state = { theme: null, th: false, t: 0, cool: false, cooledAt: null, flip0: false, flip1: false };
    // Language and theme are shared by every page through this browser's storage.
